<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#245b3e" />
    <meta name="description" content="Organiza los alimentos de tu hogar y aprovecha lo que tienes." />
    <script>
      // Apply the preference before the first paint to avoid a light flash.
      try {
        const saved = localStorage.getItem('foodflow-theme')
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <title>FoodFlow · Tu cocina, en orden</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
